<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HK WORLD BANK PLATFORM - AGI Core Nexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        hkgold: '#F59E0B',
                        hkdark: '#0B0F19',
                        hkcard: '#111827',
                        hkborder: '#1F2937'
                    }
                }
            }
        }
    >
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0B0F19; color: #F3F4F6; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #111827; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #374151; border-radius: 2px; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-hkgold selection:text-black">

    <!-- Top Navigation & Hamburger Menu (Top Left) -->
    <header class="sticky top-0 z-50 bg-hkdark/90 backdrop-blur-md border-b border-hkborder px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <!-- Hamburger Menu (Top Left) -->
            <div class="relative">
                <button id="hamburgerBtn" onclick="toggleMenu()" class="p-2 text-gray-300 hover:text-hkgold focus:outline-none transition">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
                <!-- 3-Tier Menu Drawer -->
                <div id="menuDrawer" class="hidden absolute left-0 mt-2 w-80 bg-hkcard border border-hkborder rounded-xl shadow-2xl z-50 p-4 space-y-4 text-sm custom-scrollbar max-h-[85vh] overflow-y-auto">
                    <div class="flex items-center justify-between border-b border-hkborder pb-2">
                        <span class="font-bold text-hkgold">HK NEXUS NAVIGATOR</span>
                        <button onclick="toggleMenu()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <!-- Tier 1: Whitepaper -->
                    <div class="space-y-1">
                        <button onclick="toggleSubMenu('wmSub')" class="w-full flex justify-between items-center py-2 px-3 rounded hover:bg-gray-800 text-gray-200 font-medium">
                            <span><i class="fa-solid fa-file-lines mr-2 text-hkgold"></i> 4. 백서 (Whitepaper)</span>
                            <i class="fa-solid fa-chevron-down text-xs"></i>
                        </button>
                        <div id="wmSub" class="hidden pl-6 space-y-1 text-xs text-gray-400">
                            <p class="py-1 hover:text-white cursor-pointer" onclick="openModal('백서 비전 및 아키텍처')">1. 비전 및 생태계 로드맵</p>
                            <p class="py-1 hover:text-white cursor-pointer" onclick="openModal('토크노믹스 및 분배')">2. 토크노믹스 & UBI 재단 연계</p>
                            <p class="py-1 hover:text-white cursor-pointer" onclick="openModal('기술 백서')">3. 10대 분산 연동망 알고리즘</p>
                        </div>
                    </div>
                    <!-- Tier 1: FAQ -->
                    <div class="space-y-1">
                        <button onclick="toggleSubMenu('faqSub')" class="w-full flex justify-between items-center py-2 px-3 rounded hover:bg-gray-800 text-gray-200 font-medium">
                            <span><i class="fa-solid fa-circle-question mr-2 text-hkgold"></i> 5. FAQ (고객 지원)</span>
                            <i class="fa-solid fa-chevron-down text-xs"></i>
                        </button>
                        <div id="faqSub" class="hidden pl-6 space-y-1 text-xs text-gray-400">
                            <p class="py-1 hover:text-white cursor-pointer" onclick="openModal('지갑 연결 및 KYC 자동화')">Q1. 지갑 연결 시 KYC는 어떻게 진행되나요?</p>
                            <p class="py-1 hover:text-white cursor-pointer" onclick="openModal('현금 및 타코인 스왑 결제')">Q2. 현금/카드 및 타코인 스왑 방법</p>
                            <p class="py-1 hover:text-white cursor-pointer" onclick="openModal('기본소득(UBI) 수령 조건')">Q3. UBI 및 기본소득 수령 조건은?</p>
                        </div>
                    </div>
                    <!-- Tier 1: 3대 POLICIES (With 3rd Tier nested) -->
                    <div class="space-y-1">
                        <button onclick="toggleSubMenu('policySub')" class="w-full flex justify-between items-center py-2 px-3 rounded hover:bg-gray-800 text-gray-200 font-medium">
                            <span><i class="fa-solid fa-shield-halved mr-2 text-hkgold"></i> 6. 3대 POLICIES</span>
                            <i class="fa-solid fa-chevron-down text-xs"></i>
                        </button>
                        <div id="policySub" class="hidden pl-4 space-y-2 text-xs text-gray-400 border-l border-hkborder ml-2">
                            <div>
                                <p class="font-semibold text-gray-300 py-1">정책 1: 글로벌 AML & 법정 컴플라이언스</p>
                                <p class="pl-2 text-gray-500 py-0.5 cursor-pointer" onclick="openModal('AML 및 미카(MiCA) 대응')">• 미카(MiCA) 및 클래리티(CLARITY) 준수</p>
                                <p class="pl-2 text-gray-500 py-0.5 cursor-pointer" onclick="openModal('국가별 디지털 자산법')">• 11개국 디지털 자산법 통과 (한국, 일본, 태국, 베트남, 인도, 브라질, 나이지리아, 필리핀 등)</p>
                            </div>
                            <div>
                                <p class="font-semibold text-gray-300 py-1">정책 2: 프라이버시 및 KYC/KYB 보안</p>
                                <p class="pl-2 text-gray-500 py-0.5 cursor-pointer" onclick="openModal('KYC/KYB 미인증 뷰어 정책')">• 미인증 사용자 뷰어(구경만 가능) 모드 강제</p>
                            </div>
                            <div>
                                <p class="font-semibold text-gray-300 py-1">정책 3: UBI 및 사회 공헌 투명성</p>
                                <p class="pl-2 text-gray-500 py-0.5 cursor-pointer" onclick="openModal('HK 사회 재단 투명 지급')">• HK 사회 재단 UBI 한국형 복지 모델</p>
                            </div>
                        </div>
                    </div>
                    <!-- Compliance Quick Badge Item 7 -->
                    <div class="pt-2 border-t border-hkborder text-[11px] text-gray-400">
                        <p class="font-semibold text-hkgold mb-1"><i class="fa-solid fa-globe mr-1"></i> 글로벌 법률 자동 준수</p>
                        <p class="leading-relaxed">AML, 미카, 클래리티 및 한국·일본·태국·베트남·인도·브라질·나이지리아·필리핀 자산법 실시간 연동 완료.</p>
                    </div>
                    <!-- Support Email & Contact -->
                    <div class="pt-2 border-t border-hkborder text-xs text-gray-400 flex items-center justify-between">
                        <span><i class="fa-solid fa-envelope mr-1 text-hkgold"></i> support@hkwb.world</span>
                        <span class="text-emerald-400 font-mono">AGI 삐니 대기중</span>
                    </div>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-lg bg-hkgold flex items-center justify-center font-black text-black text-sm shadow-lg">HK</div>
                <span class="font-bold tracking-wider text-sm">HK W-BANK</span>
            </div>
        </div>

        <!-- 50 Languages Selector (Item 2) -->
        <div class="flex items-center space-x-2">
            <div class="relative">
                <select id="langSelect" class="bg-gray-800 text-xs text-gray-200 border border-hkborder rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-hkgold appearance-none pr-7">
                    <option value="ko">🇰🇷 대한민국 - 한국어</option>
                    <option value="en">🇺🇸 United States - English</option>
                    <option value="ja">🇯🇵 日本 - 日本語</option>
                    <option value="th">🇹🇭 ประเทศไทย - ไทย</option>
                    <option value="vi">🇻🇳 Việt Nam - Tiếng Việt</option>
                    <option value="hi">🇮🇳 भारत - हिन्दी</option>
                    <option value="pt">🇧🇷 Brasil - Português</option>
                    <option value="yo">🇳🇳 Nigeria - Yoruba</option>
                    <option value="tl">🇵🇭 Pilipinas - Tagalog</option>
                    <!-- 50개국어 확장 구조 지원 -->
                    <option value="zh">🇨🇳 中国 - 中文</option>
                    <option value="es">🇪🇸 España - Español</option>
                    <option value="fr">🇫🇷 France - Français</option>
                    <option value="de">🇩🇪 Deutschland - Deutsch</option>
                    <option value="ar">🇸🇦 المملكة العربية السعودية - العربية</option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-400">
                    <i class="fa-solid fa-chevron-down text-[10px]"></i>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 space-y-6">

        <!-- Header Titles: HK WORLD BANK (Center, Large) & 빠른 금융 작업 (Center) -->
        <div class="text-center space-y-2 py-4">
            <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-amber-200 to-yellow-500 drop-shadow-md">
                HK WORLD BANK
            </h1>
            <p class="text-xs uppercase tracking-widest text-hkgold font-semibold">
                빠른 금융 작업
            </p>
        </div>

        <!-- System Notice / Pre-pass Banner -->
        <div id="passBanner" class="bg-emerald-950/40 border border-emerald-500/30 rounded-2xl p-4 flex items-center justify-between text-xs">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center">
                    <i class="fa-solid fa-shield-check"></i>
                </div>
                <div>
                    <p class="font-bold text-emerald-300">혜공 형님 프리패스 계정 활성화됨</p>
                    <p class="text-emerald-400/80">KYC/KYB 백그라운드 자동 인증 통과 • 최고 운영자 권한 적용</p>
                </div>
            </div>
            <span class="px-2.5 py-1 bg-emerald-500/20 text-emerald-300 rounded-full font-mono text-[10px]">SUPER_ADMIN</span>
        </div>

        <!-- Realtime Ledger & Asset Dashboard -->
        <div class="bg-hkcard border border-hkborder rounded-2xl p-5 space-y-4 shadow-xl">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <span class="w-2 h-2 rounded-full bg-hkgold animate-pulse"></span>
                    <span class="text-xs font-bold text-gray-300 uppercase tracking-wider">실시간 원장 데이터 (Live Ledger)</span>
                </div>
                <span class="text-xs text-emerald-400 font-mono bg-emerald-950/60 px-2 py-0.5 rounded border border-emerald-800/50">메인넷 승인 완료</span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Balance Box -->
                <div class="bg-gray-900/80 border border-gray-800 rounded-xl p-4 space-y-1">
                    <div class="flex items-center justify-between text-xs text-gray-400">
                        <span><i class="fa-solid fa-wallet mr-1.5 text-hkgold"></i>개인 보유 수량</span>
                        <span class="text-hkgold font-mono font-bold">PI 수량 로고 통합</span>
                    </div>
                    <div class="text-2xl font-black font-mono tracking-tight text-white flex items-center space-x-2">
                        <span>1,250,480.00</span>
                        <span class="text-xs text-hkgold px-1.5 py-0.5 bg-hkgold/10 rounded font-bold">HK / PI</span>
                    </div>
                </div>
                <!-- Interest Box -->
                <div class="bg-gray-900/80 border border-gray-800 rounded-xl p-4 space-y-1">
                    <div class="flex items-center justify-between text-xs text-gray-400">
                        <span><i class="fa-solid fa-chart-line mr-1.5 text-emerald-400"></i>실시간 누적 이자</span>
                        <span class="text-emerald-400 font-mono">연 12.4% APY</span>
                    </div>
                    <div class="text-2xl font-black font-mono tracking-tight text-emerald-400">
                        +14,285.52 <span class="text-xs text-gray-400">HK</span>
                    </div>
                </div>
            </div>

            <!-- Fiat, Card, TACOIN Deposit & Buy Option (Item 10) -->
            <div class="pt-2 border-t border-gray-800/60 flex flex-wrap items-center justify-between gap-3">
                <div class="text-xs text-gray-300">
                    <span class="font-bold text-hkgold"><i class="fa-solid fa-credit-card mr-1"></i>간편 구매 & 입금:</span> 현금, 신용카드, TACOIN 스왑 즉시 지원
                </div>
                <button onclick="openModal('코인 즉시 구매 및 결제 모듈')" class="px-4 py-2 bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-400 hover:to-yellow-500 text-black font-bold text-xs rounded-xl shadow-lg transition flex items-center space-x-2">
                    <span class="w-5 h-5 rounded-full bg-black text-hkgold flex items-center justify-center font-bold text-[10px]">π</span>
                    <span>현금/카드/타코인 코인 구매</span>
                </button>
            </div>
        </div>

        <!-- 10대 분산 연동망 프로세스 (Item 1 & Item 11) -->
        <div class="space-y-3">
            <div class="flex items-center justify-between">
                <h2 class="text-sm font-bold tracking-wide text-gray-300 flex items-center space-x-2">
                    <i class="fa-solid fa-network-wired text-hkgold"></i>
                    <span>10대 분산 연동망 및 프로세스 심기</span>
                </h2>
                <span class="text-[11px] text-gray-400">자동 KYC 백그라운드 연동</span>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-5 gap-3">
                <!-- 1. 지갑연결 -->
                <button onclick="runProcess('지갑연결')" class="bg-hkcard hover:bg-gray-800 border border-hkborder hover:border-hkgold/50 rounded-xl p-3.5 text-left space-y-2 transition group">
                    <div class="w-8 h-8 rounded-lg bg-amber-500/10 text-hkgold flex items-center justify-center group-hover:scale-110 transition">
                        <i class="fa-solid fa-wallet"></i>
                    </div>
                    <div>
                        <div class="font-bold text-xs text-gray-200">지갑연결</div>
                        <div class="text-[10px] text-gray-400">노드 계정 상시 연동</div>
                    </div>
                </button>
                <!-- 2. 송금 -->
                <button onclick="runProcess('송금')" class="bg-hkcard hover:bg-gray-800 border border-hkborder hover:border-hkgold/50 rounded-xl p-3.5 text-left space-y-2 transition group">
                    <div class="w-8 h-8 rounded-lg bg-blue-500/10 text-blue-400 flex items-center justify-center group-hover:scale-110 transition">
                        <i class="fa-solid fa-paper-plane"></i>
                    </div>
                    <div>
                        <div class="font-bold text-xs text-gray-200">송금</div>
                        <div class="text-[10px] text-gray-400">대륙간 초고속 전송</div>
                    </div>
                </button>
                <!-- 3. 결재 -->
                <button onclick="runProcess('결재')" class="bg-hkcard hover:bg-gray-800 border border-hkborder hover:border-hkgold/50 rounded-xl p-3.5 text-left space-y-2 transition group">
                    <div class="w-8 h-8 rounded-lg bg-emerald-500/10 text-emerald-400 flex items-center justify-center group-hover:scale-110 transition">
                        <i class="fa-solid fa-receipt"></i>
                    </div>
                    <div>
                        <div class="font-bold text-xs text-gray-200">결재</div>
                        <div class="text-[10px] text-gray-400">실시간 상거래 승인</div>
                    </div>
                </button>
                <!-- 4. 예치 -->
                <button onclick="runProcess('예치')" class="bg-hkcard hover:bg-gray-800 border border-hkborder hover:border-hkgold/50 rounded-xl p-3.5 text-left space-y-2 transition group">
                    <div class="w-8 h-8 rounded-lg bg-purple-500/10 text-purple-400 flex items-center justify-center group-hover:scale-110 transition">
                        <i class="fa-solid fa-vault"></i>
                    </div>
                    <div>
                        <div class="font-bold text-xs text-gray-200">예치</div>
                        <div class="text-[10px] text-gray-400">자산 자금 신탁</div>
                    </div>
                </button>
                <!-- 5. 보상 -->
                <button onclick="runProcess('보상')" class="bg-hkcard hover:bg-gray-800 border border-hkborder hover:border-hkgold/50 rounded-xl p-3.5 text-left space-y-2 transition group">
                    <div class="w-8 h-8 rounded-lg bg-pink-500/10 text-pink-400 flex items-center justify-center group-hover:scale-110 transition">
                        <i class="fa-solid fa-gift"></i>
                    </div>
                    <div>
                        <div class="font-bold text-xs text-gray-200">보상</div>
                        <div class="text-[10px] text-gray-400">인센티브 실시간 정산</div>
                    </div>
                </button>
                <!-- 6. 기본소득 -->
                <button onclick="runProcess('기본소득')" class="bg-hkcard hover:bg-gray-800 border border-hkborder hover:border-hkgold/50 rounded-xl p-3.5 text-left space-y-2 transition group">
                    <div class="w-8 h-8 rounded-lg bg-amber-500/10 text-amber-400 flex items-center justify-center group-hover:scale-110 transition">
                        <i class="fa-solid fa-hand-holding-dollar"></i>
                    </div>
                    <div>
                        <div class="font-bold text-xs text-gray-200">기본소득</div>
                        <div class="text-[10px] text-gray-400">분산 복지 재단 분배</div>
                    </div>
                </button>
                <!-- 7. 스왑 -->
                <button onclick="runProcess('스왑')" class="bg-hkcard hover:bg-gray-800 border border-hkborder hover:border-hkgold/50 rounded-xl p-3.5 text-left space-y-2 transition group">
                    <div class="w-8 h-8 rounded-lg bg-cyan-500/10 text-cyan-400 flex items-center justify-center group-hover:scale-110 transition">
                        <i class="fa-solid fa-right-left"></i>
                    </div>
                    <div>
                        <div class="font-bold text-xs text-gray-200">스왑</div>
                        <div class="text-[10px] text-gray-400">즉각 다이렉트 변환</div>
                    </div>
                </button>
                <!-- 8. DEX 스왑 -->
                <button onclick="runProcess('DEX 스왑')" class="bg-hkcard hover:bg-gray-800 border border-hkborder hover:border-hkgold/50 rounded-xl p-3.5 text-left space-y-2 transition group">
                    <div class="w-8 h-8 rounded-lg bg-orange-500/10 text-orange-400 flex items-center justify-center group-hover:scale-110 transition">
                        <i class="fa-solid fa-shuffle"></i>
                    </div>
                    <div>
                        <div class="font-bold text-xs text-gray-200">DEX 스왑</div>
                        <div class="text-[10px] text-gray-400">탈중앙화 P2P 거래</div>
                    </div>
                </button>
                <!-- 9. LP스테이킹 -->
                <button onclick="runProcess('LP스테이킹')" class="bg-hkcard hover:bg-gray-800 border border-hkborder hover:border-hkgold/50 rounded-xl p-3.5 text-left space-y-2 transition group">
                    <div class="w-8 h-8 rounded-lg bg-indigo-500/10 text-indigo-400 flex items-center justify-center group-hover:scale-110 transition">
                        <i class="fa-solid fa-layer-group"></i>
                    </div>
                    <div>
                        <div class="font-bold text-xs text-gray-200">LP스테이킹</div>
                        <div class="text-[10px] text-gray-400">유동성 증명 고리 배당</div>
                    </div>
                </button>
                <!-- 10. PI수량 -->
                <button onclick="runProcess('PI수량')" class="bg-hkcard hover:bg-gray-800 border border-hkborder hover:border-hkgold/50 rounded-xl p-3.5 text-left space-y-2 transition group">
                    <div class="w-8 h-8 rounded-lg bg-yellow-500/10 text-hkgold flex items-center justify-center group-hover:scale-110 transition">
                        <span class="font-black text-xs">π</span>
                    </div>
                    <div>
                        <div class="font-bold text-xs text-gray-200">PI수량 추가</div>
                        <div class="text-[10px] text-gray-400">PI 자산 즉시 확보</div>
                    </div>
                </button>
            </div>
        </div>

        <!-- HK Social Foundation & UBI Section (Item 12) -->
        <div class="bg-hkcard border border-hkborder rounded-2xl p-5 space-y-3">
            <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-gray-300"><i class="fa-solid fa-heart-circle-check text-hkgold mr-1.5"></i>HK 사회 재단 & UBI 모델</span>
                <span class="text-[10px] bg-amber-500/20 text-hkgold px-2 py-0.5 rounded font-mono">한국형 복지 모델</span>

            document.getElementById('modalContent').innerHTML = content || `

            document.getElementById('menuDrawer').classList.add('hidden');

            `);

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const chatBox = document.getElementById('chatBox');
            if(!input.value.trim()) return;

            const userText = input.value;
            chatBox.innerHTML += `
                <div class="flex items-start justify-end space-x-2">
                    <div class="bg-hkgold text-black p-3 rounded-xl rounded-tr-none max-w-[85%] font-medium">
                        <p>${userText}</p>
                    </div>
                    <div class="w-6 h-6 rounded-full bg-gray-700 text-white flex items-center justify-center font-bold text-[10px] shrink-0">형님</div>
                </div>
            `;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            setTimeout(() => {
                chatBox.innerHTML += `
                    <div class="flex items-start space-x-2">
                        <div class="w-6 h-6 rounded-full bg-hkgold text-black flex items-center justify-center font-bold text-[10px] shrink-0">삐니</div>

                        </div>
                    </div>
                `;
                chatBox.scrollTop = chatBox.scrollHeight;
