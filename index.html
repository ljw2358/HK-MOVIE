    // 언어 변경 함수
    function changeLanguage(lang) {
      const t = translations[lang] || translations['en'];
      for (const key in t) {
        const element = document.getElementById(key);
        if (element) {
          element.innerText = t[key];
        }
      }
      localStorage.setItem('selectedLang', lang);
    }

    // 25개국어 자동 락업 보강
    ['pt', 'zh', 'zh-tw', 'ja', 'ru', 'vi', 'th', 'id', 'ms', 'ar', 'de', 'it', 'fr', 'es', 'hi', 'tr', 'pl', 'nl', 'sv', 'cs', 'el', 'uk', 'ro'].forEach(lang => {
      if(!translations[lang]) {
        translations[lang] = translations['en'];
      }
    });

    // 페이지 로드 시 선택된 언어 유지
    window.onload = function() {
      const savedLang = localStorage.getItem('selectedLang') || 'ko';
      const selectElem = document.getElementById('langSelect');
      if (selectElem) {
        selectElem.value = savedLang;
        changeLanguage(savedLang);
      }
    };
  </script>
